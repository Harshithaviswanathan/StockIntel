# Render Blueprint — StockIntel backend (LITE mode for free tier)
# ENABLE_RAG=false → Groq + Yahoo Finance only (stable on 512MB RAM)
# For full RAG locally: ENABLE_RAG=true in Backend1/.env

services:
  - type: web
    name: stockintel-api
    runtime: python
    rootDir: Backend1
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ENABLE_RAG
        value: "false"
      - key: VECTOR_DB_PATH
        value: /opt/render/project/src/data/new_vector_db
      - key: RAG_DATA_PATH
        value: /opt/render/project/src/data/rag_data
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"

# Render Blueprint — StockIntel backend
# Deploy: Render Dashboard → New → Blueprint → connect GitHub repo
#
# Note: Persistent disk requires a paid Render plan (Starter+).
# On Free tier, vector data resets on redeploy — ingest stocks again after deploy.

services:
  - type: web
    name: stockintel-api
    runtime: python
    rootDir: Backend1
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: VECTOR_DB_PATH
        value: /opt/render/project/src/data/new_vector_db
      - key: RAG_DATA_PATH
        value: /opt/render/project/src/data/rag_data
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"

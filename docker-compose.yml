services:
  backend:
    build:
      context: ./Backend1
      dockerfile: Dockerfile
    container_name: stockintel-api
    ports:
      - "8000:8000"
    env_file:
      - ./Backend1/.env
    environment:
      VECTOR_DB_PATH: /app/data/new_vector_db
      RAG_DATA_PATH: /app/data/rag_data
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5174,http://localhost
    volumes:
      - chroma_data:/app/data/new_vector_db
      - rag_data:/app/data/rag_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./Frontend1
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: stockintel-ui
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  rag_data:
